<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PIN Popup</title>
  <style>
    /* Basic styling for popup */
    body{
      user-select: none;
    }
    .popup {
      display: block;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid #ccc;
      background: #fff;
      padding: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      z-index: 1000;
    }
    .popup input {
      font-size: 18px;
      letter-spacing: 5px;
      text-align: center;
      width: 80px;
    }
    .popup button {
      margin-top: 10px;
    }
    /* Overlay background */
    .overlay {
      display: block;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 999;
    }
  </style>
</head>
<body>
  <!-- <button onclick="openPopup()">Enter PIN</button> -->

  <div class="overlay" id="overlay"></div>
  <div class="popup" id="popup">
    <h3>Enter 4-digit PIN (Send On Your Mail)</h3>
    <form method="POST" action="{{url_for('submit_pin', id = matcher_id , role = userRole ) }}">
      <input type="text" name="pin" maxlength="4" pattern="\d{4}" required>
      <br>
      <button type="submit">Submit</button>
      <button type="button" onclick="window.location.href='/matches'">Cancel</button>

    </form>
  </div>
  {% if error %}
   <script>
    alert("Incorrect PIN. Please try again.");
    openPopup(); // re-open popup so user can retry
  </script>
  {% endif %}

    // }
    // function closePopup() {
    //   document.getElementById("popup").style.display = "none";
    //   document.getElementById("overlay").style.display = "none";
      
    // }
  </script>
</body>
</html>
